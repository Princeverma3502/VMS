name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Run backend tests
        working-directory: backend
        run: npm test -- --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: testsecret_ci
          # Use GitHub's CDN mirror so mongodb-memory-server binary downloads fast in CI
          MONGOMS_DOWNLOAD_MIRROR: https://fastdl.mongodb.org
          MONGOMS_VERSION: 7.0.14
      - name: Run npm audit
        working-directory: backend
        run: npm audit --audit-level=high || true

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Run frontend unit tests (Vitest)
        working-directory: frontend
        run: npx vitest run --reporter=verbose
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npx playwright test --reporter=list
        env:
          CI: true
          # Force Playwright to use the built preview server (defined in playwright.config.js)
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:4173
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: ./frontend/playwright-report/
          retention-days: 30
      - name: Lint frontend
        working-directory: frontend
        run: npx eslint . || true
      - name: Run npm audit
        working-directory: frontend
        run: npm audit --audit-level=high || true
